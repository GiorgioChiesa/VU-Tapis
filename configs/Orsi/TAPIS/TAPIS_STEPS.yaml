TRAIN:
  ENABLE: True
  DATASET: orsi
  BATCH_SIZE: 16
  ACCUM_STEPS: 1
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: True
  CHECKPOINT_FILE_PATH: data/pretrained_models/train/LONG.pyth
  CHECKPOINT_EPOCH_RESET: True
  FREEZE_ENCODER: False
  MIXED_PRECISION: True   # aggiungere questa riga
TEST:
  ENABLE: True
  DATASET: orsi
  BATCH_SIZE: 64 #24
DATA:
  NUM_FRAMES: 16
  SAMPLING_RATE: 1
  SEQ_MODE: center # or "center" or "after"
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TRAIN_CROP_SIZE_LARGE: 224
  TEST_CROP_SIZE: 224
  TEST_CROP_SIZE_LARGE: 224
  INPUT_CHANNEL_NUM: [3]
  JUST_CENTER: True
ENDOVIS_DATASET:
  DETECTION_SCORE_THRESH: 0.75
  TRAIN_USE_COLOR_AUGMENTATION: True
  INCLUDE_GT: True
  USE_PREDS: False
MVIT:
  ZERO_DECAY_POS_CLS: False
  NUM_HEADS: 1
  EMBED_DIM: 96
  PATCH_KERNEL: (3, 7, 7)
  PATCH_STRIDE: (2, 4, 4)
  PATCH_PADDING: (1, 3, 3)
  MLP_RATIO: 4.0
  QKV_BIAS: True
  DROPOUT_RATE: 0.0
  DROPPATH_RATE: 0.2
  NORM: "layernorm"
  MODE: "conv"
  DEPTH: 16
  POOL_Q_STRIDE: [[1, 1, 2, 2], [3, 1, 2, 2], [14, 1, 2, 2]]
  DIM_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  HEAD_MUL: [[1, 2.0], [3, 2.0], [14, 2.0]]
  POOL_KV_STRIDE_ADAPTIVE: [1, 8, 8]
  POOL_KVQ_KERNEL: [3, 3, 3]
  SEP_POS_EMBED: True
  CLS_EMBED_ON: True
  FREEZE_PATCH: False
REGIONS:
  ENABLE: False
  ALIGNED: True
  ROI_XFORM_RESOLUTION: 3
AUG:
  ENABLE: True
  COLOR_JITTER: 0.4
  AA_TYPE: rand-m7-n4-mstd0.5-inc1
  INTERPOLATION: bicubic
  NUM_SAMPLE: 1
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: False
  TEMPORAL_JITTER: 0.1  # ±10% frame rate variation
  SPATIAL_AUG: True     # Random crops, flips
SOLVER:
  BASE_LR_SCALE_NUM_SHARDS: True
  BASE_LR: 5e-5
  CLIP_GRAD_L2NORM: 0.01
  LR_POLICY: cosine
  COSINE_AFTER_WARMUP: True
  COSINE_END_LR: 5e-6 #1e-5
  MAX_EPOCH: 50
  MAX_ITER: 10000
  EARLY_STOP_ep_th: [5, -1.0] # epoch and threshold for early stopping, if the metric does not improve for this many epochs by at least this threshold, stop training.
  WARMUP_EPOCHS: 10.0
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  ZERO_WD_1D_PARAM: True
  WARMUP_START_LR:  1e-5 # 0.0000125
  OPTIMIZING_METHOD: adam
MODEL:
  ARCH: mvit
  MODEL_NAME: MViT
  LOSS_FUNC: soft_cross_entropy
  DROPOUT_RATE: 0.5
TASKS:
  TASKS:  ["steps"]
  NUM_CLASSES: [32]
  LOSS_FUNC: ["cross_entropy"]
  HEAD_ACT:  ["softmax"]
  LOSS_WEIGHTS:  [1.0]
  METRICS: ["mAP"]  
  WEIGHT_LOSS_BY_CLASS: [steps_distribution.csv]
  FOCAL_GAMMA: 2.0
  FOCAL_ALPHA_MODE: "auto"  # auto, manual, or None
DATA_LOADER:
  NUM_WORKERS: 5
  PIN_MEMORY: True
FEATURES:
  ENABLE: False
RNG_SEED: 0
LOG_PERIOD: 50000
OUTPUT_DIR: .
MAX_SAVE_VIDEO: 10
ENDOVIS_DATASET:
  EXCLUDE_EVENT_NAMES: ["Idle", "Out_of_body", "Back_inside_body ","Final_reinforcing_suture" ,"Inside_abdomen", "Test_image_start", "Remove_gauze","Remove_hemostatic_agens", "Unsuccesful_clip_placement","Hemostatic_metal_clip_placement","Aiding_suture_stitch","Aiding_suture_clip_placement","3D_model", "Fat_removal", "Instrument_swap:_insertion", "Test_image_stop", "Incision_of_the_fascia_-_right"," Remove_needle_bladder_stretch_stitch", "Lift_right_seminal_vesicle", "Lift_left_seminal_vesicle", "Stitch_in_DVC_after_apical_dissection","Needle_removal_DVC_ligation", "Stitch_in_urethra", "Tie_suture", "Threads_removal","Vessel_loop_removal", "Camera_stop","Camera_out_of_body","Hemolock_clip_removal","Hemolock_clip_on_bladder_pedicle_attached_to_prostate"]
  TRAIN_GT_BOX_JSON: [all_merged.json]
  TEST_GT_BOX_JSON: [all_merged.json]
  ORSI_ROOT_DIR: /home/gchie/workspace/data/orsi_tensors